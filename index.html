<!DOCTYPE html>
<html lang="zh-TW">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Ma+Shan+Zheng&display=swap');
        
        :root {
            --kyoto-red: #B22D15;
            --bamboo-green: #3A4D39;
            --osaka-gold: #D4AF37;
            --washi-bg: #F9F6F0;
            --stay-dark: #1A1A1A;
            --premium-navy: #1E272E;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--washi-bg);
            color: #2D3436;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            text-align: left;
        }

        .calligraphy { font-family: 'Ma Shan Zheng', cursive !important; }
        .kaity { font-family: 'DFKai-SB', '標楷體', 'Kaiti TC', 'KaiTi', serif !important; }

        .tab-active {
            background: var(--kyoto-red) !important;
            color: white !important;
            box-shadow: 0 8px 20px rgba(178, 45, 21, 0.35);
            transform: scale(1.08);
        }

        .glass-tool {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-slideUp { animation: slideUp 0.3s cubic-bezier(0, 0, 0.2, 1) forwards; }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-immersive-header {
            height: 320px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .modal-immersive-overlay {
            background: linear-gradient(to bottom, rgba(249, 246, 240, 0.1) 0%, rgba(249, 246, 240, 0.9) 100%);
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .text-shadow-premium {
            text-shadow: 0 0 15px rgba(255, 255, 255, 1), 0 0 5px rgba(255, 255, 255, 0.8);
        }

        .badge-spot { background: #E6F3FF; color: #007AFF; }
        .badge-food { background: #FFF4E6; color: #FF9500; }
        .badge-stay { background: rgba(255, 215, 0, 0.2); color: #FFD700; border: 1px solid rgba(255, 215, 0, 0.3); }
        .badge-check { background: rgba(255, 255, 255, 0.2); color: #FFFFFF; border: 1px solid rgba(255, 255, 255, 0.4); }
        
        .card-stay {
            background-color: var(--stay-dark) !important;
            color: #FFFFFF !important;
            border-left: 6px solid var(--osaka-gold) !important;
        }
        
        .card-check {
            background: var(--premium-navy) !important;
            color: #FFFFFF !important;
            border-left: 6px solid #5758BB !important;
            box-shadow: 0 10px 25px rgba(30, 39, 46, 0.25) !important;
        }

        .btn-press:active { transform: scale(0.92); opacity: 0.8; }
        #stamina-ring { transition: stroke-dashoffset 1.2s ease-out; }
    </style>
</head>
<body class="max-w-md mx-auto shadow-2xl min-h-screen pb-48 relative text-left">

                events: [
                    { t: "08:00", s: "VIP 專屬入口報到", type: "體驗", i: "crown", n: "尊榮導覽啟程，專屬休息室。", m: "USJ+VIP+Entrance", imgDetail: "https://images.unsplash.com/photo-1590233461421-47701389772d?auto=format&fit=crop&w=800", detailTitle: "VIP 專屬報到", intro: `搭乘預約包車前往。建議司機在「飯店接送區 (Bus/Taxi Drop-off)」下車，該處距離 VIP 入口僅需步行 2 分鐘。入園後直入豪華休息室，在啟程前先享用免費咖啡與飲品，並領取專屬頸鍊。`, reserved: true },

                                <section class="bg-white p-7 rounded-[2.5rem] border border-gray-100 shadow-sm text-left text-left text-left"><h4 class="text-xl font-black kaity text-[--kyoto-red] mb-3 text-left text-left text-left"><i class="fas fa-user-tie mr-2 text-left text-left text-left"></i>資深導遊觀點</h4><p class="text-[14px] font-bold italic text-gray-700 text-left text-left text-left">${d.aiGuide || '首席導遊：這是一個極佳的安排，請放鬆享受之旅。'}</p></section>
                                ${d.vegNote ? `<section class="bg-emerald-50 p-7 rounded-[2.5rem] border border-emerald-100 text-left text-left text-left"><h4 class="text-xl font-black kaity text-emerald-700 mb-2 text-left text-left text-left text-left"><i class="fas fa-leaf mr-2 text-left text-left text-left"></i>蔬食導航 (素食友善)</h4><p class="text-[14px] font-bold text-emerald-800 text-left text-left text-left text-left">${d.vegNote}</p></section>` : ''}
                                ${d.website ? `<a href="${d.website}" target="_blank" class="block w-full py-5 bg-blue-600 text-white rounded-[2rem] text-center text-lg font-black kaity shadow-xl btn-press text-left text-left text-left text-left"><i class="fas fa-external-link-alt mr-2 text-left text-left text-left"></i>開啟官網查看</a>` : ''}
                                <a href="https://www.google.com/maps/search/?api=1&query=${d.m}" target="_blank" class="block w-full py-5 bg-gray-900 text-white rounded-[2rem] text-center text-lg font-black kaity shadow-xl btn-press text-left text-left text-left text-left">開啟 Google 地圖導引</a>
                            </div>
                        </div>`;
                }
            }, 50);
        };

        window.runConversion = () => {
            const jpy = document.getElementById('jpy-input')?.value, output = document.getElementById('twd-output');
            if (output && jpy) output.innerText = (parseFloat(jpy) * exchangeRate).toLocaleString('zh-TW', {maximumFractionDigits: 1});
        };

        async function updateWeatherUI(city, eng) {
            const coords = eng === "Osaka" ? "latitude=34.69&longitude=135.50" : "latitude=35.01&longitude=135.77";
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?${coords}&current_weather=true`);
                if (!res.ok) return;
                const d = await res.json(), temp = Math.round(d.current_weather.temperature), code = d.current_weather.weathercode;
                let icon = code >= 51 ? "fa-cloud-showers-heavy" : (code >= 1 ? "fa-cloud-sun" : "fa-sun");
                document.getElementById('weather-city-name').innerText = city;
                document.getElementById('weather-icon-inline').innerHTML = `<i class="fas ${icon} text-left text-left"></i>`;
                document.getElementById('weather-temp-calligraphy').innerText = `${temp}°C`;
            } catch (e) {}
        }

        window.switchDay = (d) => {
            const data = tourData[d]; if (!data) return;
            document.querySelectorAll('#day-nav-container button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById(`tab${d}`).classList.add('tab-active');
            document.getElementById('header-bg').src = data.img;
            const ring = document.getElementById('stamina-ring'), dash = 176 - (176 * (data.stamina || 100) / 100);
            ring.style.strokeDashoffset = dash; document.getElementById('stamina-val').innerText = (data.stamina || 100) + '%';

            let html = `<div class="fade-in space-y-6">`;
            data.events.forEach((e, idx) => {
                let isStay = e.type === '住宿', isCheck = e.type === '檢查';
                let badgeClass = isStay ? 'badge-stay' : (isCheck ? 'badge-check' : (e.type === '美食' || e.type === '餐廳' || e.type === '購物' || e.type === '體驗' ? 'badge-food' : 'badge-spot'));
                let cardClass = isStay ? 'card-stay shadow-lg' : (isCheck ? 'card-check shadow-lg' : 'bg-white shadow-sm border border-gray-100');
                html += `<div class="relative pl-8 mb-8 border-l-2 border-dashed border-gray-200 text-left text-left" onclick="window.toggleTool('detail', ${d}, ${idx})"><div class="absolute -left-2 top-0 w-4 h-4 rounded-full ${isStay ? 'bg-[--osaka-gold]' : (isCheck ? 'bg-[#BEB7FF]' : 'bg-[--kyoto-red]')} border-4 border-white shadow-md text-left text-left"></div><div class="${cardClass} rounded-[2.5rem] p-7 active:scale-[0.97] transition-all text-left text-left text-left"><div class="flex justify-between items-center mb-4 text-left text-left text-left text-left text-left text-left"><span class="${isStay ? 'bg-amber-600' : (isCheck ? 'bg-indigo-900/30' : 'bg-[--bamboo-green]')} text-white text-[9px] px-3 py-1 rounded-full font-bold shadow-sm text-left text-left">${e.t}</span><div class="flex gap-2 text-left text-left text-left text-left text-left text-left text-left">${e.reserved ? `<span class="bg-amber-100 text-amber-600 text-[8px] font-black px-2 py-1 rounded-lg border border-amber-200 text-left text-left text-left">預約</span>` : ''}<span class="${badgeClass} text-[8px] font-black px-2.5 py-1 rounded-lg text-left text-left text-left">${e.type}</span></div></div><h3 class="text-xl font-bold mb-2 kaity flex items-center text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left"><i class="fas fa-${e.i || 'map-marker-alt'} mr-3 ${isStay ? 'text-[--osaka-gold]' : (isCheck ? 'text-white' : 'text-[--kyoto-red]')} text-lg opacity-80 text-left text-left text-left text-left text-left text-left text-left"></i>${e.s}</h3><p class="text-xs font-bold mb-4 line-clamp-1 opacity-80 text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left">${e.n}</p><div class="${isStay || isCheck ? 'bg-white/10' : 'bg-red-50'} px-4 py-2.5 rounded-2xl text-[10px] font-black border border-white/20 flex items-center justify-between text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left"><span><i class="fas fa-eye mr-2 text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left"></i>${isStay ? '查看飯店特色' : '查看詳情攻略'}</span><i class="fas fa-chevron-right text-[8px] opacity-40 text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left"></i></div></div></div>`;
            });
            document.getElementById('main-content').innerHTML = html + `</div>`;
            updateWeatherUI(data.loc, data.engLoc); window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.addExpense = async () => {
            const n = document.getElementById('ledger-item-name')?.value, a = parseFloat(document.getElementById('ledger-item-amount')?.value);
            if (!user || !n || isNaN(a)) return;
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'kansai-pro-2025';
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'expenses'), { name: n, amount: a, timestamp: Date.now() });
                document.getElementById('ledger-item-name').value = ''; document.getElementById('ledger-item-amount').value = '';
            } catch (e) {}
        };

        window.deleteExpense = async (id) => {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'kansai-pro-2025';
            try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'expenses', id)); } catch (e) {}
        };

        function renderLedger() {
            const list = document.getElementById('ledger-list'); if (!list) return;
            const t = expenses.reduce((s, i) => s + i.amount, 0);
            document.getElementById('ledger-total-jpy').innerText = `¥ ${t.toLocaleString()}`;
            list.innerHTML = expenses.map(i => `<div class="flex justify-between items-center bg-white p-5 rounded-3xl shadow-sm border border-gray-100 font-bold fade-in text-left text-left text-left text-left text-left text-left text-left text-left text-left"><div class="flex-1 font-black text-gray-800 font-mono text-left text-left text-left text-left">${i.name}</div><div class="text-right flex items-center gap-4 text-left text-left text-left text-left text-left text-left text-left text-left"><p class="text-lg text-[--kyoto-red] font-mono font-black text-left text-left text-left text-left text-left text-left">¥ ${i.amount.toLocaleString()}</p><button onclick="window.deleteExpense('${i.id}')" class="text-gray-300 transition px-2 text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left"><i class="fas fa-trash-alt text-xs text-left text-left text-left text-left"></i></button></div></div>`).join('');
        }

        window.onload = async () => {
            const nav = document.getElementById('day-nav-container'), dayNames = ["第一日", "第二日", "第三日", "第四日", "第五日", "第六日"];
            nav.innerHTML = dayNames.map((n, i) => `<button onclick="window.switchDay(${i+1})" id="tab${i+1}" class="px-8 py-3 rounded-[1.5rem] bg-white text-gray-400 shadow-sm border border-gray-100 font-black transition-all text-xs text-center text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left">${n}</button>`).join('');
            try { window.switchDay(1); } catch (e) {}
            try {
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "preview" };
                const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'kansai-pro-2025';
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { await signInWithCustomToken(auth, __initial_auth_token); } else { await signInAnonymously(auth); }
                onAuthStateChanged(auth, (u) => {
                    user = u; if (user) {
                        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'expenses'), (snapshot) => {
                            expenses = snapshot.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.timestamp - a.timestamp);
                            if (document.getElementById('ledger-list')) renderLedger();
                        });
                    }
                });
                const rateRes = await fetch('https://open.er-api.com/v6/latest/JPY');
                if (rateRes.ok) { const rateData = await rateRes.json(); exchangeRate = rateData.rates.TWD; window.liveRateText = `1 JPY = ${exchangeRate.toFixed(3)} TWD`; }
            } catch (e) {}
        };
    </script>
</body>
</html>
